<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    {% include "head.html" %}
    {% include "../open_graph.html" %}
    {% include "../markdown_editor_head.html" %}
    <script type="module" src="{{ url_for("statics", "weekly/preview.js") }}"></script>
    <title>Edit weekly</title>
  </head>
  <body>
    {% include "../nav.html" %}
    <div id="EditWrapper">
      <h2>Editing {{ weekly.week_str }}</h2>
      <div id="EditAndPreview">
        <form id="EditView" action="{{ url_for("edit", session_user + "/" + weekly.date_str) }}" method="post">
          <div>
            <label for="WeeklyContent">Weekly post (MacroDown)</label>
            <textarea id="WeeklyContent" data-markdown-editor
              data-external-preview name="content">{{ weekly.content }}</textarea>
          </div>
          <div>
            <input type="submit" value="Save" />
          </div>
        </form>
        <div id="Preview">
          <div id="SingleWeekly">
            <p id="PreviewStatus" role="status">Loading preview…</p>
            <section class="Weekly"></section>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
