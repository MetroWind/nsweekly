<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screenshot browser fixture</title>
  <link rel="stylesheet" href="/statics/games/games.css">
  <link rel="stylesheet" href="/statics/games/screenshots.css">
  <script src="/statics/games/screenshots.js" defer></script>
</head>
<body><main id="Games" class="Screenshots">
  <h1>Public screenshots</h1>
  <form id="ScreenshotUpload" action="/fixture/upload" method="post"
        enctype="multipart/form-data">
    <div class="ScreenshotUploadControls">
      <label>Screenshots <input type="file" name="files" multiple></label>
      <button type="submit">Upload screenshots</button>
      <button id="ScreenshotRetry" type="button" hidden>Retry failed files</button>
    </div>
    <progress id="ScreenshotProgress" value="0" max="1" hidden></progress>
    <p id="ScreenshotUploadStatus" role="status"></p>
    <ul id="ScreenshotResults"></ul>
  </form>
  <div class="ScreenshotGallery">
    <figure><a class="ScreenshotPreview" data-screenshot-id="11" href="#screenshot-11"
      data-preview="/fixture/preview.png"
      data-delete="/fixture/delete/first" data-original="/fixture/original.png" data-filename="山 &amp; Moon.png">
      <img src="/fixture/thumbnail.png" width="320" height="180"
        alt="山 &amp; Moon.png" loading="lazy" decoding="async"></a>
      <button class="ScreenshotCopy" type="button" hidden
              aria-label="Copy preview URL" title="Copy preview URL">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H5v16h14V5h-4"/>
          <rect x="9" y="3" width="6" height="4"/>
        </svg>
      </button>
      <noscript><a class="ScreenshotFallback" href="/fixture/preview.png">Open compressed preview</a></noscript>
</figure>
    <figure><a class="ScreenshotPreview" data-screenshot-id="22" href="#screenshot-22"
      data-preview="/fixture/unsupported.jxl"
      data-delete="/fixture/delete/second" data-original="/fixture/second_original.png" data-filename="second.png">
      <img src="/fixture/thumbnail.png" width="320" height="180"
        alt="second.png" loading="lazy" decoding="async"></a>
      <button class="ScreenshotCopy" type="button" hidden
              aria-label="Copy preview URL" title="Copy preview URL">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 5H5v16h14V5h-4"/>
          <rect x="9" y="3" width="6" height="4"/>
        </svg>
      </button>
      <noscript><a class="ScreenshotFallback" href="/fixture/unsupported.jxl">Open compressed preview</a></noscript>
</figure>
  </div>
  <p id="ScreenshotCopyStatus" role="status" aria-live="polite"></p>
  <dialog id="ScreenshotDialog" aria-labelledby="ScreenshotTitle"
          tabindex="-1">
    <button type="button" id="ScreenshotClose" aria-label="Close preview">
      <span aria-hidden="true">×</span></button>
    <button type="button" id="ScreenshotCloseLeft" aria-label="Close preview">
      <span aria-hidden="true">×</span></button>
    <button type="button" id="ScreenshotPrevious"
            aria-label="Previous screenshot"><span aria-hidden="true">‹</span></button>
    <button type="button" id="ScreenshotNext"
            aria-label="Next screenshot"><span aria-hidden="true">›</span></button>
    <h2 id="ScreenshotTitle"></h2>
    <a id="ScreenshotOriginal" aria-label="Open original image">
      <img id="ScreenshotImage" alt="" hidden decoding="async">
      <p id="ScreenshotStatus" role="status" aria-live="polite"></p>
    </a>
    <a id="ScreenshotDelete" aria-label="Delete screenshot" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>
      </svg>
    </a>
  </dialog>
</main></body></html>
