# Include inside the virtual host, BEFORE a catch-all ProxyPass.
# Requires mod_alias, mod_headers, mod_mime, mod_proxy, mod_setenvif.
# Adapt both paths to attachment-dir. Only hex captures enter disk paths.
ProxyPass "/attachment/" "!"
AliasMatch "^/attachment/(([0-9a-f]{2})[0-9a-f]{30})/[^/]+$" \
    "/var/lib/nsweekly/attachments/$2/$1"

<Directory "/var/lib/nsweekly/attachments">
    Require all granted
    AllowOverride None
    Options -Indexes -ExecCGI -Includes -MultiViews
    SetHandler default-handler
    ForceType application/octet-stream
    Header set Content-Disposition "attachment"
    Header always set X-Content-Type-Options "nosniff"
    Header set Cache-Control "public, max-age=3600" "expr=%{REQUEST_STATUS} == 200 || %{REQUEST_STATUS} == 206 || %{REQUEST_STATUS} == 304"
    Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} >= 400"
</Directory>

# Fixed passive raster MIME types only. These rules inspect the cosmetic URL,
# not physical filenames. A false suffix never enables active content.
<LocationMatch "^/attachment/[0-9a-f]{32}/[^/]+\.(?i:jpe?g)$">
    ForceType image/jpeg
    Header set Content-Disposition "inline"
</LocationMatch>
<LocationMatch "^/attachment/[0-9a-f]{32}/[^/]+\.(?i:png)$">
    ForceType image/png
    Header set Content-Disposition "inline"
</LocationMatch>
<LocationMatch "^/attachment/[0-9a-f]{32}/[^/]+\.(?i:webp)$">
    ForceType image/webp
    Header set Content-Disposition "inline"
</LocationMatch>

# No filename header is interpolated here: browsers derive the saved basename
# from the URL. Test Unicode/space/percent/quote filenames in your deployed
# Firefox and Chromium versions. This example does not promise filename*.
# .staging is deliberately outside every AliasMatch. Do not Alias the root.
